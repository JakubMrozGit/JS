name: Build tv-launcher APK

on:
  push:
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/build-tv-launcher.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-debug-apk
          path: tv-launcher/app/build/outputs/apk/debug/app-debug.apk
